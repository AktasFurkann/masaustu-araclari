<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ApexTube Video Yakalayıcı</title>
  <style>
    :root {
      --bg: #0B0F19;
      --card: #151D2F;
      --input: #0A0E17;
      --border: #253248;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --success: #10B981;
      --danger: #EF4444;
      --purple: #8B5CF6;
      --cyan: #06B6D4;
      --text: #F8FAFC;
      --text-2: #94A3B8;
      --muted: #64748B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 380px;
      background: var(--bg);
      color: var(--text);
      font: 13px "Segoe UI", system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 14px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--success); }
    .dot.off { background: var(--danger); }
    main { padding: 10px; max-height: 420px; overflow-y: auto; }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .row { display: flex; align-items: center; gap: 8px; }
    .kind {
      flex: none;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      color: #fff;
      background: var(--accent);
    }
    .kind.DASH { background: var(--purple); }
    .kind.Video { background: var(--cyan); }
    .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { margin-top: 4px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 6px; margin-top: 8px; }
    button {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font: inherit;
      font-weight: 600;
      color: var(--text);
      background: var(--input);
      cursor: pointer;
    }
    button:hover { background: var(--border); }
    button.primary { flex: 1; border: none; background: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    .empty { padding: 28px 16px; text-align: center; color: var(--text-2); line-height: 1.5; }
    .empty strong { display: block; color: var(--text); margin-bottom: 4px; }
    .toast { padding: 8px 14px; font-size: 12px; border-top: 1px solid var(--border); color: var(--text-2); }
    .toast.ok { color: var(--success); }
    .toast.err { color: var(--danger); }
    .toast:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>ApexTube Video Yakalayıcı</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Kontrol ediliyor…</span></div>
  </header>
  <main id="list"></main>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
